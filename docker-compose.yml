# ============================================================
# FlyPic - Docker Compose 配置
# 适用于任何支持 Docker Compose 的 NAS
# ============================================================

services:
  flypic:
    build:
      context: https://github.com/shouhu1917/FlyPic.git#main
      dockerfile: Dockerfile
    # 如果想用预构建镜像，注释掉 build，取消注释 image：
    # image: ghcr.io/shouhu1917/flypic:latest
    
    container_name: flypic
    restart: unless-stopped
    
    ports:
      - "15002:15002"
    
    volumes:
      # 素材库目录 - 映射你的图片文件夹
      # NAS 路径示例：
      #   群晖: /volume1/photos
      #   威联通: /share/photos
      #   自建: /mnt/data/photos
      - /path/to/your/photos:/photos:ro
      
      # 数据目录 - 存放配置、数据库、缩略图
      # 这个目录会存储：
      #   - config.json (应用配置)
      #   - 素材库的 .flypic 数据库和缩略图
      - flypic-data:/data
    
    environment:
      # 服务端口（默认 15002）
      - PORT=15002
      # Node 环境
      - NODE_ENV=production
      # 时区（可选，影响日志时间）
      - TZ=Asia/Shanghai
    
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); const req = http.get('http://localhost:15002/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.setTimeout(3000, () => { req.destroy(); process.exit(1); });"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  flypic-data:
    name: flypic-data

# 网络配置（可选）
# networks:
#   default:
#     driver: bridge
